name: Release

# Na main: se há changesets pendentes, abre/atualiza o PR "Versionar pacote".
# Quando esse PR entra, publica a versão nova no npm com proveniência.
on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # proveniência no npm

jobs:
  # Antes de cada release: o pacote empacotado nos apps das CLIs oficiais.
  pacote:
    uses: ./.github/workflows/pacote.yml

  release:
    needs: pacote
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          title: 'Versionar pacote'
          commit: 'Versionar pacote'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
